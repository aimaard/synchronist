# Template used by setup-deployment.sh, see README.md for complete examples.
services:
  synchronist:
    image: siegy22/synchronist:1.0.0.beta3
    restart: always
    ports:
      - "<port>:3000"
    environment:
      SYNCHRONIST_MODE: "<mode>"
      SYNCHRONIST_USERNAME: "<username>"
      SYNCHRONIST_PASSWORD: "<password>"
<environment>
    volumes:
      - synchronist_storage:/synchronist/storage
<volumes>

volumes:
  synchronist_storage:
