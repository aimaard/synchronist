services:
  synchronist:
    image: siegy22/synchronist:1.0.0.beta2
    volumes:
      - synchronist_storage:/synchronist/storage
<volumes>
    environment:
      SYNCHRONIST_USERNAME: "<username>"
      SYNCHRONIST_PASSWORD: "<password>"
      SECRET_KEY_BASE: "<secret_key>"
    ports:
      - "<port>:3000"
    restart: always

volumes:
  synchronist_storage:
