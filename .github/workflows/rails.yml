name: Rails

on:
  push:
    branches: ['**']
  pull_request:
  # Run by the release workflow before publishing the image
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
    - uses: actions/checkout@v7
    - name: Install system dependencies
      run: sudo apt-get update -y && sudo apt-get -yqq install rsync
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: yarn
    - name: Install JavaScript dependencies
      run: yarn install --frozen-lockfile
    - name: Prepare Database
      run: bin/rails db:test:prepare
    - name: Run ruby tests
      run: bin/rails test
    - name: Run system test cases
      run: bin/rails test:system
    - name: Run benchmarks
      run: bin/benchmark

  docker:
    # Make sure the image still builds, releases build and publish it (see release.yml)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
    - uses: docker/setup-buildx-action@v4
    - name: Build image
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
