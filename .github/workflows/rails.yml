name: Rails

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
    - uses: actions/checkout@v7
    - name: Install system dependencies
      run: sudo apt-get update -y && sudo apt-get -yqq install libpq-dev rsync
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: yarn
    - name: Install JavaScript dependencies
      run: yarn install --frozen-lockfile
    - name: Prepare Database
      run: bin/rails db:test:prepare
    - name: Run ruby tests
      run: bin/rails test
    - name: Run system test cases
      run: bin/rails test:system
    - name: Run benchmarks
      run: bin/benchmark
