name: Release

# Releases are created by pushing a tag, e.g.:
#   git tag 1.0.0 && git push origin 1.0.0
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/rails.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to ghcr.io
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - name: Log in to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Image tags and labels
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        # The image is tagged with the git tag (e.g. 1.0.0) and latest (the newest release)
        tags: type=ref,event=tag
        flavor: latest=true
    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: SYNCHRONIST_VERSION=${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        IMAGE: ghcr.io/${{ github.repository }}
      run: |
        options=(--verify-tag --generate-notes --notes "Docker image: \`${IMAGE,,}:$TAG\`")
        # Tags like 1.0.0.beta3 or 1.0.0-rc1 are pre-releases
        if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
          options+=(--prerelease)
        fi
        gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" "${options[@]}"
