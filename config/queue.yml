default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
  # Recurring tasks are scheduled at runtime from the configuration UI (see ConfigForm)
  scheduler:
    dynamic_tasks_enabled: true
    polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
